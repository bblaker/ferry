# Host settings Ferry checks at startup. Install as
# /etc/sysctl.d/90-ferry.conf, replace eth0 with Ferry's interface, and run
# `sudo sysctl --system`. See docs/deploy.md.

# bpf_fib_lookup, which Ferry uses to find next hops, refuses to route for
# an interface with forwarding off. This also lets the kernel route other
# traffic arriving on it.
net.ipv4.conf.eth0.forwarding = 1

# Keep the kernel from using Ferry's SNAT ports (-snat-ports, default
# 40000-59999) for this host's own connections.
net.ipv4.ip_local_reserved_ports = 40000-59999
