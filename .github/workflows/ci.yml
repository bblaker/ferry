name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # arm64 is the Raspberry Pi edge host's architecture.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install BPF toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev ethtool

      # Generate first: internal/dataplane doesn't compile on Linux without
      # the bpf2go output.
      - run: make generate-native
      - run: make check

      # Both need root; GitHub's runners allow passwordless sudo.
      - name: BPF tests (BPF_PROG_TEST_RUN)
        run: make test-bpf-native
      - name: End-to-end test (real connections, xdp-generic and xdp-native)
        run: make e2e-native

      # Built natively on arm64, from the same checkout the tests just ran on.
      - name: Build Raspberry Pi binary
        if: runner.arch == 'ARM64'
        run: make build-linux
      - if: runner.arch == 'ARM64'
        uses: actions/upload-artifact@v7
        with:
          name: ferry-linux-arm64
          path: bin/ferry-linux-arm64
          retention-days: 7
